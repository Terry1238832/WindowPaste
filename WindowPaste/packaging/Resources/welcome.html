<h2>窗贴 1.0.0</h2>
<p>按下 <b>⌘`</b> 截取 LetsView（或其他软件）里指定的窗口，复制到剪贴板并粘贴到当前光标位置。可在设置里选择窗口，也可打开「自动回车」在聊天框里直接发送。</p>
<p>把「窗贴」拖到「应用程序」即可安装。安装后会同时出现在程序坞和菜单栏。</p>
