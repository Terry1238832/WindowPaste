<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>使用说明</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 13px; line-height: 1.55; color: #222; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  ol { padding-left: 1.3em; }
  li { margin: 6px 0; }
</style>
</head>
<body>
<h2>安装后请开启权限</h2>
<ol>
  <li>把「窗贴」拖到「应用程序」，然后打开它。程序坞和菜单栏都会出现图标。</li>
  <li>打开 LetsView，保持要截的窗口不要最小化，在设置里点选该窗口。</li>
  <li>给「窗贴」打开 <b>屏幕录制</b> 和 <b>辅助功能</b>。没有辅助功能时，截图仍会进入剪贴板。</li>
  <li>把光标放到聊天框或文档里，按下 ⌘`。需要自动发送时，打开「自动回车」。</li>
</ol>
<p>关掉设置窗口不会退出。点程序坞里的窗贴即可再打开。软件运行时会占用系统自带的「切换当前应用窗口」快捷键。</p>
</body>
</html>
